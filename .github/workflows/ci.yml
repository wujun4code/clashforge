name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 1

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: ui-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/api/ui_dist/

      - name: Build
        run: go build ./...

      - name: Go network domain regressions
        env:
          GOMAXPROCS: '2'
        run: go test -p 2 -count=1 ./internal/config ./internal/netfilter ./internal/dns ./internal/api ./internal/quickstart ./cmd/clashforge ./tests/integration

  openwrt-scripts:
    name: OpenWrt script and digest regressions (no router)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production shell sandbox and downloader HTTP fixtures
        run: |
          python3 -m pip install 'PyYAML==6.0.2'
          python3 tests/e2e/test_openwrt_scripts.py
          python3 tests/e2e/test_mihomo_download.py
          python3 tests/e2e/test_probe_contract.py
          python3 tests/e2e/test_subscription_contract.py
          python3 tests/e2e/test_openwrt_proxy_selection.py
          python3 tests/e2e/test_ci_contract.py
          python3 tests/android/test_emulator_runner.py
          python3 tests/android/test_diagnostics_encryption.py

