services:
  # ── Traffic integration test (uses mihomo + real proxy) ──────────────────
  clashforge-test:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
    container_name: clashforge-integration-test
    environment:
      E2E_EXPECTED_NODE: ${E2E_EXPECTED_NODE:-Tokyo-AnyTLS}
      E2E_EXPECTED_TYPE: ${E2E_EXPECTED_TYPE:-anytls}
      E2E_EXPECTED_COUNTRY: ${E2E_EXPECTED_COUNTRY:-JP}
      E2E_EXPECTED_CITY: ${E2E_EXPECTED_CITY:-Tokyo}
    volumes:
      - ${CLASHFORGE_E2E_SUBSCRIPTION_FILE:-../../testdata/sample-clash-config.yaml}:/testdata/sample-clash-config.yaml:ro

  # ── API integration test (production image + curl/python3 for testing) ───
  clashforge-api-test:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.apitest
    container_name: clashforge-api-test
    volumes:
      - ./api_test.sh:/api_test.sh:ro
      - ./api_test_entrypoint.sh:/api_test_entrypoint.sh:ro
